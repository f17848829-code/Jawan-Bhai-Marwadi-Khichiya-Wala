<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Jawan Bhai Marwadi Khichiya Wala</title>
    <script type="text/javascript">
      // GitHub Pages SPA Hash Redirect
      var l = window.location;
      var pathSegments = l.pathname.split('/').filter(Boolean);
      // If hosted on GitHub Pages subpath (e.g. username.github.io/repo-name/path)
      var repo = pathSegments[0] || '';
      var subPath = pathSegments.slice(1).join('/');
      var target = l.protocol + '//' + l.host + '/' + (repo ? repo + '/' : '') + '#/' + subPath + (l.search || '') + (l.hash ? l.hash.replace(/^#/, '') : '');
      window.location.replace(target);
    </script>
  </head>
  <body>
    <p>Loading Jawan Bhai Marwadi Khichiya Wala...</p>
  </body>
</html>
